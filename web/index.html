<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decent Sync</title>
    <!-- The logomark, drawn into public/ by scripts/render-icons.mjs: SVG where the browser takes it, the ICO where it
         doesn't, and the PNG on an iOS or iPadOS home screen. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Paints the first frame in the chosen theme, before the app's JavaScript runs: src/lib/theme.ts reads the same
         key and values, and keeps the page in the theme from then on. -->
    <script>
      (function () {
        // A browser blocking the site's storage throws, which reads as System.
        var choice = null;
        try {
          choice = localStorage.getItem("decent-sync-theme");
        } catch (error) {}
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
