<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decent Sync</title>
    <!-- Paints the first frame in the chosen theme, before the app's JavaScript runs: src/lib/theme.ts reads the same
         key and values, and keeps the page in the theme from then on. -->
    <script>
      (function () {
        // A browser blocking the site's storage throws, which reads as System.
        var choice = null;
        try {
          choice = localStorage.getItem("decent-sync-theme");
        } catch (error) {}
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
