name: CI

# Pull requests run on their merge result; main runs again after each merge.
# Branches without a pull request get no CI.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Same major version as docker-compose.yml.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: decent_sync
          POSTGRES_PASSWORD: decent_sync
          POSTGRES_DB: decent_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decent_sync -d decent_sync"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://decent_sync:decent_sync@localhost:5432/decent_sync
      PUBLIC_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Decaid installs the committed build, so it must match its source.
      - name: Check the committed plugin build is fresh
        run: npm run check:plugin-build

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Vitest
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
