name: CI

# Pull requests run on their merge result; main runs again after each merge.
# Branches without a pull request get no CI. The release workflow publishes
# only a commit this workflow has passed on.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The checks and tests run as parallel jobs, the tests in shards, so the run
# takes about as long as its slowest shard rather than all of them in turn.
# The release waits for the whole run.
jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Decaid installs the committed build, so it must match its source.
      - name: Check the committed plugin build is fresh
        run: npm run check:plugin-build

      - name: Typecheck
        run: npm run typecheck

  # vitest.config.ts deals the test files out to the shards by size.
  vitest:
    name: vitest (${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres: &postgres
        # Same major version as docker-compose.yml.
        image: postgres:17
        env:
          POSTGRES_USER: decent_sync
          POSTGRES_PASSWORD: decent_sync
          POSTGRES_DB: decent_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decent_sync -d decent_sync"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env: &env
      DATABASE_URL: postgresql://decent_sync:decent_sync@localhost:5432/decent_sync
      PUBLIC_URL: http://localhost:3000

    steps:
      - &checkout
        uses: actions/checkout@v7

      - &setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - &install
        name: Install
        run: npm ci

      # Only a crash of PostgreSQL itself would need what it writes to be on
      # disk, and the test databases are thrown away. Each test file creates
      # and drops a database, which flushes the disk, and the tests commit
      # thousands of transactions.
      - &unflushed-postgres
        name: Stop PostgreSQL waiting for the disk
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U decent_sync -d decent_sync
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      - &build
        name: Build
        run: npm run build

      - name: Vitest
        run: npx vitest run --shard=${{ matrix.shard }}/4

  playwright:
    name: playwright (${{ matrix.shard }}/2)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres: *postgres

    env: *env

    steps:
      - *checkout
      - *setup-node
      - *install
      - *unflushed-postgres
      - *build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Builds what a release publishes without publishing it: the plugin ZIP, and
  # the server image run the way a self-hoster runs it.
  package:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Package the plugin ZIP
        run: npm run package:plugin

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: dist/*.zip
          retention-days: 7

      # --build uses this commit's image rather than a published one.
      - name: Start the server image and PostgreSQL with Docker Compose
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Check the server migrated and serves the management interface
        run: |
          curl --fail --silent --show-error http://localhost:3000/api/health
          curl --fail --silent --show-error http://localhost:3000/ | grep --quiet '<div id="root">'
          docker compose logs server | grep --quiet "All migrations have been successfully applied"

      - name: Server logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down --volumes
