name: Release

# Pushing a vX.Y.Z tag releases the whole repo at that version (ADR-0012): the
# server image goes to GitHub's container registry, then a GitHub release
# attaches the one plugin ZIP that Decaid's release install downloads, its
# notes starting with the version's upgrade notes from UPGRADING.md. Nothing
# is published unless the tag matches the committed plugin manifest's version,
# no upgrade notes wait unreleased, and CI has passed on the tagged commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the tag matches the plugin manifest's version
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"

      # Read before anything is published: notes still under Unreleased stop the release.
      - name: Read the release's upgrade notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/upgrade-notes.md"

      # CI has already run on the tagged commit when it landed on main, so use
      # that result instead of running it again. Only main's push runs count:
      # pull request runs test a merge with main, not the tagged tree. A tag
      # pushed right after a merge waits for main's run to start and finish.
      - name: Wait for CI to pass on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          run=""
          for _ in $(seq 30); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --branch main --commit "$sha" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::CI has not run on $sha as a push to main. Tag a commit on main."
            exit 1
          fi
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null
          echo "CI passed on $sha: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run"

      - name: Package the plugin ZIP
        run: npm run package:plugin

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # vX.Y.Z publishes X.Y.Z, X.Y and latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push the server image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Last, so a tablet never sees a release whose server image is missing.
      # The upgrade notes, if any, come before the generated notes.
      - name: Create the GitHub release with the plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=()
          if [ -s "$RUNNER_TEMP/upgrade-notes.md" ]; then notes=(--notes "$(cat "$RUNNER_TEMP/upgrade-notes.md")"); fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${notes[@]}"
