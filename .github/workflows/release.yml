name: Release

# Pushing a vX.Y.Z tag releases the whole repo at that version (ADR-0012): the
# server image goes to GitHub's container registry, then a GitHub release
# attaches the one plugin ZIP that Decaid's release install downloads, its
# notes starting with the version's upgrade notes from UPGRADING.md. Nothing
# is published unless the tag matches the committed plugin manifest's version,
# no upgrade notes wait unreleased, and CI has passed on the tagged commit.
#
# Once they are published, the documentation site (site/) is built at the tag
# and deployed to GitHub Pages. Its deploy is a job of its own after the
# release's, so one that fails leaves the release published. Running the
# workflow by hand deploys the site alone, for the tag, branch or commit given.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: The tag, branch or commit whose documentation to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Check the tag matches the plugin manifest's version
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"

      # Read before anything is published: notes still under Unreleased stop the release.
      - name: Read the release's upgrade notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/upgrade-notes.md"

      # CI has already run on the tagged commit when it landed on main, so use
      # that result instead of running it again. Only main's push runs count:
      # pull request runs test a merge with main, not the tagged tree. A tag
      # pushed right after a merge waits for main's run to start and finish.
      - name: Wait for CI to pass on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          run=""
          for _ in $(seq 30); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --branch main --commit "$sha" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::CI has not run on $sha as a push to main. Tag a commit on main."
            exit 1
          fi
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null
          echo "CI passed on $sha: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run"

      - name: Package the plugin ZIP
        run: npm run package:plugin

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # vX.Y.Z publishes X.Y.Z, X.Y and latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push the server image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Last, so a tablet never sees a release whose server image is missing.
      # The upgrade notes, if any, come before the generated notes.
      - name: Create the GitHub release with the plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=()
          if [ -s "$RUNNER_TEMP/upgrade-notes.md" ]; then notes=(--notes "$(cat "$RUNNER_TEMP/upgrade-notes.md")"); fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${notes[@]}"

  # Deploys the documentation site to GitHub Pages, which serves the gh-pages
  # branch at loganfuller.github.io/decent-sync. scripts/deploy-site.mjs builds
  # the site at the checked-out version and places it in a checkout of that
  # branch: at its minor release's own path, and at the root when no newer
  # minor is there. On a tag it runs only once the release is published; by
  # hand it runs alone. Deploys run one at a time, since each pushes the branch.
  site:
    needs: publish
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: site-deploy

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install
        run: npm ci

      # The first deploy finds no gh-pages branch and starts it, with no history of main's.
      - name: Check out the gh-pages branch
        run: |
          remote="https://github.com/$GITHUB_REPOSITORY"
          if git ls-remote --exit-code --heads "$remote" gh-pages > /dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" "$RUNNER_TEMP/pages"
          else
            git init --quiet --initial-branch gh-pages "$RUNNER_TEMP/pages"
          fi

      - name: Build the site and place it
        run: node scripts/deploy-site.mjs "$RUNNER_TEMP/pages"

      - name: Push the gh-pages branch
        working-directory: ${{ runner.temp }}/pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "The site is already as deployed."
            exit 0
          fi
          git commit --quiet --message "Deploy the site for v$(node -p 'require(process.env.GITHUB_WORKSPACE + "/package.json").version') from $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" gh-pages
